<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="0.4" y2="1"><stop offset="0" stop-color="#211f19"/><stop offset="1" stop-color="#111317"/></linearGradient>
 <linearGradient id="top" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2b2c33"/><stop offset="1" stop-color="#1d1e24"/></linearGradient>
 <linearGradient id="bot" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#17181d"/><stop offset="1" stop-color="#0f1014"/></linearGradient>
 <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#dcc07a"/><stop offset="1" stop-color="#b8964f"/></linearGradient>
 <clipPath id="ct"><rect x="252" y="232" width="520" height="280"/></clipPath>
 <clipPath id="cb"><rect x="252" y="512" width="520" height="280"/></clipPath>
 <filter id="sh" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#000" flood-opacity=".6"/></filter>
 <symbol id="bat" viewBox="0 0 64 40"><path d="M29 20 L14 4 L4 9 L9 14 L12 13 L15 19 L19 18 L22 24 L28 27.5 Q32 31 36 27.5 L42 25 L45 20 L49 21 L52 15 L55 16 L61 12 L51 6 L35 20 Q35.5 17.5 34.4 15.6 L35.2 10.6 L32.9 14.2 Q32 13.9 31.1 14.2 L28.8 10.6 L29.6 15.6 Q28.5 17.5 29 20 Z"/></symbol>
</defs>
<rect width="1024" height="1024" fill="url(#bg)"/>
<!-- stacked card behind (flip deck) -->
<rect x="292" y="300" width="440" height="540" rx="60" fill="#2a2830"/><rect x="292" y="300" width="440" height="540" rx="60" fill="none" stroke="#c8a862" stroke-opacity=".18" stroke-width="3"/>
<g filter="url(#sh)">
 <rect x="252" y="232" width="520" height="560" rx="72" fill="url(#bot)"/>
 <rect x="252" y="232" width="520" height="560" rx="72" fill="url(#top)" clip-path="url(#ct)"/>
 <rect x="252.5" y="232.5" width="519" height="559" rx="72" fill="none" stroke="#c8a862" stroke-opacity=".22" stroke-width="3"/>
</g>
<!-- bat split by the hinge: top half bright, bottom half slightly shaded -->
<g clip-path="url(#ct)"><use href="#bat" x="282" y="392" width="460" height="287.5" fill="url(#gold)"/></g>
<g clip-path="url(#cb)"><use href="#bat" x="282" y="392" width="460" height="287.5" fill="#a88a4b"/></g>
<!-- hinge -->
<rect x="252" y="505" width="520" height="14" fill="#07080a"/>
<rect x="244" y="478" width="22" height="68" rx="6" fill="#07080a"/>
<rect x="758" y="478" width="22" height="68" rx="6" fill="#07080a"/>
</svg>
